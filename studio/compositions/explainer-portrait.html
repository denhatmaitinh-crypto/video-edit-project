      .compare-tag.bad { color: #ff6b35; }

      .compare-word.good-word { font-family: "Fraunces", serif; }
      .compare-sub { margin-top: 8px; font-size: 22px; color: rgba(253,250,245,0.55); }
      .strike { position: absolute; left: 40px; right: 40px; top: 50%; height: 4px; background: #ff6b35; transform-origin: left center; transform: scaleX(0); }

      /* Beat 6 : waveform */
      .wave-wrap { position: absolute; top: 700px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 10px; height: 200px; }
      .wave-bar { width: 16px; border-radius: 8px; background: #5a5a7a; }

      /* Beat 7 : multi-format cards */
      .format-card {
        position: absolute; opacity: 0;
        border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.45);

      .signoff-mark { font-family: "Fraunces", serif; font-weight: 600; font-size: 92px; color: #fdfaf5; margin: 0 0 14px 0; }

      }
